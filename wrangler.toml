name = "ma8ic-8all"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = true

rules = [{ type = "Text", globs = ["**/*.md"], fallthrough = true }]

[ai]
binding = "AI"

# Auth: Cloudflare Access in front; the Worker verifies the Access JWT (src/auth.js). No secrets.
[vars]
ACCESS_TEAM_DOMAIN = "klappy.cloudflareaccess.com"
ACCESS_AUD = "" # filled with the Access app AUD at wiring time; empty = every /mcp and /v1 call is 403
# Optional D1 for telemetry: add [[d1_databases]] binding = "DB" after `schema.sql` is applied.
